<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор стоимости — Rafam</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); padding: 16px; }
    h1 { font-size: 20px; margin-bottom: 16px; }
    .step { margin-bottom: 16px; }
    .step label { display: block; font-size: 13px; opacity: 0.7; margin-bottom: 6px; }
    select {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      background: var(--tg-theme-secondary-bg-color, #f5f5f5);
      color: var(--tg-theme-text-color, #000);
      font-size: 16px; appearance: none;
    }
    select:disabled { opacity: 0.5; }
    .result {
      margin-top: 20px; padding: 20px; border-radius: 14px;
      background: #2e7d32; color: #fff; text-align: center;
    }
    .result-label { font-size: 14px; opacity: 0.9; margin-bottom: 6px; }
    .result-price { font-size: 32px; font-weight: bold; }
    .result-details { font-size: 13px; opacity: 0.85; margin-top: 10px; line-height: 1.5; }
    .empty { text-align: center; opacity: 0.5; padding: 40px 20px; }
    button { 
      width: 100%; padding: 14px; margin-top: 16px; border: none;
      border-radius: 10px; background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff); font-size: 16px; font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🧮 Калькулятор стоимости</h1>

  <div class="step">
    <label>Бренд</label>
    <select id="brand-select"><option value="">Выберите бренд</option></select>
  </div>

  <div class="step">
    <label>Аромат</label>
    <select id="aroma-select" disabled><option value="">Сначала выберите бренд</option></select>
  </div>

  <div class="step">
    <label>Формат</label>
    <select id="format-select" disabled>
      <option value="">Сначала выберите аромат</option>
      <option value="Масло">Масло</option>
      <option value="Духи">Духи</option>
      <option value="В машину">В машину</option>
    </select>
  </div>

  <div class="step">
    <label>Объём</label>
    <select id="volume-select" disabled><option value="">Сначала выберите формат</option></select>
  </div>

  <div class="step">
    <label>Вид флакона</label>
    <select id="view-select" disabled><option value="">Сначала выберите объём</option></select>
  </div>

  <div id="result" class="result" style="display:none;">
    <div class="result-label">Итого к оплате</div>
    <div class="result-price" id="result-price">0 ₽</div>
    <div class="result-details" id="result-details"></div>
  </div>

  <div id="empty" class="empty" style="display:none;">
    Выберите все параметры, чтобы увидеть цену
  </div>

  <button id="contact-btn" style="display:none;">Связаться с продавцом</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const API_URL = "https://script.google.com/macros/s/AKfycbxG1MNpZgZnKPK0Lw2TG9hvmrn6-Ma7Gy8Qknih_3tN962-aW3D7DNNSLeC6jfRxW-FsQ/exec?type=calc";

    let aromas = [];
    let bottles = [];
    let selectedAroma = null;
    let selectedBottle = null;

    async function loadData() {
      try {
        const response = await fetch(API_URL + "?type=calc&callback=jsonpCallback");
        const text = await response.text();
        const result = JSON.parse(text.replace(/^jsonpCallback\(/, "").replace(/\);?$/, ""));
        if (result.status === "ok") {
          aromas = result.data.aromas;
          bottles = result.data.bottles;
          initBrands();
          checkPreSelected();
        }
      } catch (e) {
        console.error("Ошибка загрузки:", e);
      }
    }

    function initBrands() {
      const brands = [...new Set(aromas.map(a => a.brand))].sort();
      const select = document.getElementById("brand-select");
      brands.forEach(b => {
        const opt = document.createElement("option");
        opt.value = b; opt.textContent = b;
        select.appendChild(opt);
      });
    }

    function checkPreSelected() {
      const params = new URLSearchParams(window.location.search);
      const preAroma = params.get("aroma");
      const preBrand = params.get("brand");
      if (preAroma && preBrand) {
        document.getElementById("brand-select").value = preBrand;
        onBrandChange();
        document.getElementById("aroma-select").value = preAroma;
        onAromaChange();
      }
    }

    document.getElementById("brand-select").addEventListener("change", onBrandChange);

    function onBrandChange() {
      const brand = document.getElementById("brand-select").value;
      const aromaSelect = document.getElementById("aroma-select");
      aromaSelect.innerHTML = '<option value="">Выберите аромат</option>';
      
      if (!brand) {
        aromaSelect.disabled = true;
        resetBelow("aroma");
        return;
      }
      
      const list = aromas.filter(a => a.brand === brand);
      list.forEach(a => {
        const opt = document.createElement("option");
        opt.value = a.name; opt.textContent = a.name;
        aromaSelect.appendChild(opt);
      });
      aromaSelect.disabled = false;
      resetBelow("aroma");
    }

    document.getElementById("aroma-select").addEventListener("change", onAromaChange);

    function onAromaChange() {
      const brand = document.getElementById("brand-select").value;
      const name = document.getElementById("aroma-select").value;
      selectedAroma = aromas.find(a => a.brand === brand && a.name === name);
      
      const formatSelect = document.getElementById("format-select");
      formatSelect.disabled = !selectedAroma;
      if (selectedAroma) formatSelect.value = "";
      resetBelow("format");
    }

    document.getElementById("format-select").addEventListener("change", onFormatChange);

    function onFormatChange() {
      const format = document.getElementById("format-select").value;
      const volumeSelect = document.getElementById("volume-select");
      volumeSelect.innerHTML = '<option value="">Выберите объём</option>';
      
      if (!format) {
        volumeSelect.disabled = true;
        resetBelow("volume");
        return;
      }
      
      const volumes = [...new Set(bottles.filter(b => b.format === format).map(b => b.volume))];
      volumes.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v; opt.textContent = v + " мл";
        volumeSelect.appendChild(opt);
      });
      volumeSelect.disabled = false;
      resetBelow("volume");
    }

    document.getElementById("volume-select").addEventListener("change", onVolumeChange);

    function onVolumeChange() {
      const format = document.getElementById("format-select").value;
      const volume = document.getElementById("volume-select").value;
      const viewSelect = document.getElementById("view-select");
      viewSelect.innerHTML = '<option value="">Выберите вид</option>';
      
      if (!volume) {
        viewSelect.disabled = true;
        resetBelow("view");
        return;
      }
      
      const views = bottles.filter(b => b.format === format && b.volume === volume);
      views.forEach(b => {
        const opt = document.createElement("option");
        opt.value = b.view; opt.textContent = b.view;
        viewSelect.appendChild(opt);
      });
      viewSelect.disabled = false;
      resetBelow("view");
    }

    document.getElementById("view-select").addEventListener("change", onViewChange);

    function onViewChange() {
      const format = document.getElementById("format-select").value;
      const volume = document.getElementById("volume-select").value;
      const view = document.getElementById("view-select").value;
      
      if (!view) { resetResult(); return; }
      
      selectedBottle = bottles.find(b => b.format === format && b.volume === volume && b.view === view);
      calculate();
    }

    function resetBelow(level) {
      if (level === "aroma") {
        document.getElementById("format-select").value = "";
        document.getElementById("format-select").disabled = true;
      }
      if (level === "aroma" || level === "format") {
        document.getElementById("volume-select").innerHTML = '<option value="">Сначала выберите формат</option>';
        document.getElementById("volume-select").disabled = true;
      }
      if (level !== "view") {
        document.getElementById("view-select").innerHTML = '<option value="">Сначала выберите объём</option>';
        document.getElementById("view-select").disabled = true;
      }
      resetResult();
    }

    function resetResult() {
      document.getElementById("result").style.display = "none";
      document.getElementById("empty").style.display = "block";
      document.getElementById("contact-btn").style.display = "none";
    }

    function calculate() {
      if (!selectedAroma || !selectedBottle) return;
      const format = document.getElementById("format-select").value;
      const volume = parseFloat(document.getElementById("volume-select").value);
      
      let oilMl;
      if (format === "Масло") oilMl = volume;
      else if (format === "Духи") oilMl = volume / 2;
      else if (format === "В машину") oilMl = volume * 0.3;
      else oilMl = volume;
      
      const oilCost = Math.round(oilMl * selectedAroma.pricePerMl);
      const total = oilCost + selectedBottle.price;
      
      document.getElementById("result-price").textContent = total + " ₽";
      document.getElementById("result-details").innerHTML =
        `${selectedAroma.brand} — ${selectedAroma.name}<br>` +
        `Формат: ${format}, объём: ${volume} мл<br>` +
        `Флакон: ${selectedBottle.view}`;
      
      document.getElementById("result").style.display = "block";
      document.getElementById("empty").style.display = "none";
      document.getElementById("contact-btn").style.display = "block";
    }

    document.getElementById("contact-btn").addEventListener("click", () => {
      tg.openTelegramLink("https://t.me/rafamptz_bot");
      tg.close();
    });

    loadData();
  </script>
</body>
</html>
